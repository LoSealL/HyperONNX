name: Run hyperonnx unit tests
run-name: ${{ github.actor }} unit tests
on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - 'hyperonnx/**.py'
      - 'tests/**.py'
jobs:
  run-public-tests:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        python-version: ["3.12"]
        extra: [test-torch210-tf560, test-torch213-tf56]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: loseall/ONNXifier
          fetch-depth: 1
          path: deps/ONNXifier
      - name: Update onnxifier source path in pyproject.toml
        run: sed -i 's|path = "../ONNXifier"|path = "deps/ONNXifier"|g' pyproject.toml
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev --extra=cpu --extra=${{ matrix.extra }}
      - name: Run pytest and coverage
        run: |
          uv run --dev --extra=cpu --extra=${{ matrix.extra }} pytest --cov=hyperonnx --cov-branch --cov-report=xml tests
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
