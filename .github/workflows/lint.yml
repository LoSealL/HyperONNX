name: check coding styles
run-name: ${{ github.actor }} lint
on:
  pull_request:
    paths:
      - 'hyperonnx/**'
      - 'tests/**'
jobs:
  run-lint-public:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        python-version: ["3.12"]
        transformers-version: ["4.53.0", "5.1.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/checkout@v6
        with:
          repository: loseall/ONNXifier
          fetch-depth: 1
          path: deps/ONNXifier
      - name: Update onnxifier source path in pyproject.toml
        run: sed -i 's|path = "../ONNXifier"|path = "deps/ONNXifier"|g' pyproject.toml
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/Jod
      - name: pyright type check
        run: |
          uv sync --dev --extra=cuda
          uv pip install 'transformers==${{ matrix.transformers-version }}'
          uv run pyright hyperonnx
          uv run pre-commit run -s HEAD^ -o HEAD
